<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบเตรียมสอบ 90 ข้อ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        /* Header & Welcome Screen */
        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-screen h1 {
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .welcome-screen p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: #64748b;
            box-shadow: 0 4px 12px rgba(100, 116, 139, 0.2);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: var(--error-color);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        /* Quiz Screen */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .quiz-progress-text {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff;
            font-size: 1.05rem;
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background-color: #f5f3ff;
        }

        .option-item input {
            margin-right: 15px;
            transform: scale(1.2);
            accent-color: var(--primary-color);
        }

        .option-item.correct {
            border-color: var(--success-color);
            background-color: #ecfdf5;
            color: #065f46;
        }

        .option-item.incorrect {
            border-color: var(--error-color);
            background-color: #fef2f2;
            color: #991b1b;
        }

        .explanation-box {
            background-color: #f8fafc;
            border-left: 5px solid var(--primary-color);
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box h4 {
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            border-top: 2px solid var(--border-color);
            padding-top: 20px;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 20px;
        }

        .result-screen h2 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .score-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            border: 1px solid var(--border-color);
        }

        .score-item h3 {
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .score-item p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .wrong-review-section {
            text-align: left;
            margin-top: 30px;
        }

        .wrong-review-section h3 {
            margin-bottom: 15px;
            color: var(--error-color);
        }

        .wrong-item-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .score-card {
                grid-template-columns: 1fr;
            }
            .quiz-footer {
                flex-direction: column;
                gap: 10px;
            }
            .quiz-footer button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <!-- หน้าเริ่มต้น -->
        <div id="welcome-screen" class="welcome-screen">
            <h1>แบบทดสอบเตรียมสอบ 90 ข้อ</h1>
            <p>แบบทดสอบครอบคลุมเนื้อหาหลักการตลาด การจัดจำหน่าย ผลิตภัณฑ์ ราคา และการกระจายสินค้าทั้งหมดจากใบงาน</p>
            <p style="font-weight: 600; margin-bottom: 25px;">จำนวนข้อสอบทั้งหมด: 90 ข้อ</p>
            <button class="btn" onclick="startQuiz()">เริ่มทำข้อสอบ</button>
        </div>

        <!-- หน้าทำข้อสอบ -->
        <div id="quiz-screen" class="hidden">
            <div class="quiz-header">
                <span class="quiz-progress-text" id="progress-indicator">ข้อ 1 / 90</span>
                <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.9rem;" onclick="confirmReset()">รีเซ็ตคำตอบทั้งหมด</button>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="question-box" id="question-text">
                <!-- โจทย์จะแสดงที่นี่ -->
            </div>

            <div class="options-list" id="options-container">
                <!-- ตัวเลือกจะแสดงที่นี่ -->
            </div>

            <div class="explanation-box" id="explanation-box">
                <h4 id="explanation-title">เฉลยและคำอธิบาย</h4>
                <p id="explanation-text"></p>
            </div>

            <div class="quiz-footer">
                <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>ย้อนกลับ</button>
                <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>ข้อถัดไป</button>
            </div>
        </div>

        <!-- หน้าสรุปผล -->
        <div id="result-screen" class="result-screen hidden">
            <h2>สรุปผลการทดสอบ</h2>
            <p>คุณทำแบบทดสอบครบทั้ง 90 ข้อเรียบร้อยแล้ว</p>
            
            <div class="score-card">
                <div class="score-item">
                    <h3 id="final-score">0</h3>
                    <p>คะแนนที่ได้</p>
                </div>
                <div class="score-item">
                    <h3 id="final-percentage">0%</h3>
                    <p>เปอร์เซ็นต์</p>
                </div>
                <div class="score-item">
                    <h3 id="final-wrong">0</h3>
                    <p>ตอบผิด</p>
                </div>
            </div>

            <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                <button class="btn" onclick="startQuiz()">ทำข้อสอบใหม่อีกครั้ง</button>
                <button class="btn btn-secondary" onclick="confirmReset()">รีเซ็ตทั้งหมด</button>
            </div>

            <div class="wrong-review-section" id="wrong-review-container">
                <!-- รายการข้อที่ตอบผิดจะแสดงที่นี่ -->
            </div>
        </div>
    </div>

    <script>
        // ฐานข้อมูลข้อสอบ 90 ข้อจากใบงาน
        const questions = [
            // วงจรชีวิตผลิตภัณฑ์ (1-10)
            {
                q: "วงจรชีวิตผลิตภัณฑ์ (Product Life Cycle) มีทั้งหมดกี่ขั้นตอน?",
                options: ["ก. 3 ขั้นตอน", "ข. 4 ขั้นตอน", "ค. 5 ขั้นตอน", "ง. 6 ขั้นตอน"],
                answer: 1,
                explanation: "วงจรชีวิตผลิตภัณฑ์ประกอบด้วย 4 ขั้นตอนหลัก ได้แก่ ขั้นแนะนำ (Introduction), ขั้นเติบโต (Growth), ขั้นอิ่มตัว (Maturity) และขั้นตกต่ำ (Decline)"
            },
            {
                q: "ขั้นแรกสุดของวงจรชีวิตผลิตภัณฑ์ (Product Life Cycle) คือข้อใด?",
                options: ["ก. ขั้นแนะนำ", "ข. ขั้นเติบโต", "ค. ขั้นอิ่มตัว", "ง. ขั้นตกต่ำ"],
                answer: 0,
                explanation: "ขั้นแนะนำ (Introduction) เป็นขั้นตอนแรกเมื่อสินค้าใหม่ออกสู่ตลาด ยอดขายยังน้อยและค่าใช้จ่ายในการแนะนำสินค้าสูง"
            },
            {
                q: "ขั้นใดในวงจรชีวิตผลิตภัณฑ์ที่ยอดขายเริ่มเติบโตอย่างรวดเร็วและมีกำไรเพิ่มขึ้นสูงสุด?",
                options: ["ก. ขั้นแนะนำ", "ข. ขั้นเติบโต", "ค. ขั้นอิ่มตัว", "ง. ขั้นตกต่ำ"],
                answer: 1,
                explanation: "ขั้นเติบโต (Growth) เป็นช่วงที่ตลาดเริ่มยอมรับสินค้า ยอดขายพุ่งสูงขึ้นอย่างรวดเร็ว"
            },
            {
                q: "ลักษณะสำคัญของ 'ขั้นอิ่มตัว' ในวงจรชีวิตผลิตภัณฑ์คืออะไร?",
                options: ["ก. ยอดขายเติบโตอย่างรวดเร็วที่สุด", "ข. ยอดขายเริ่มทรงตัวและแข่งขันกันสูงมาก", "ค. ไม่มีคู่แข่งในตลาดเลย", "ง. ยอดขายตกลงอย่างรวดเร็วจนต้องเลิกกิจการ"],
                answer: 1,
                explanation: "ขั้นอิ่มตัว (Maturity) ยอดขายจะเริ่มทรงตัวหรือเติบโตในอัตราที่ช้าลง เนื่องจากตลาดเริ่มอิ่มตัวและมีการแข่งขันสูงจากคู่แข่งจำนวนมาก"
            },
            {
                q: "ขั้นตอนสุดท้ายของวงจรชีวิตผลิตภัณฑ์ (Product Life Cycle) คือข้อใด?",
                options: ["ก. ขั้นแนะนำ", "ข. ขั้นเติบโต", "ค. ขั้นอิ่มตัว", "ง. ขั้นตกต่ำ"],
                answer: 3,
                explanation: "ขั้นตกต่ำ (Decline) เป็นช่วงที่ยอดขายและกำไรลดลงอย่างต่อเนื่อง เนื่องจากพฤติกรรมผู้บริโภคเปลี่ยนหรือมีสินค้าใหม่ที่ดีกว่ามาทดแทน"
            },
            {
                q: "การพัฒนาผลิตภัณฑ์ใหม่มีทั้งหมดกี่ขั้นตอนตามเนื้อหาในใบงาน?",
                options: ["ก. 5 ขั้นตอน", "ข. 6 ขั้นตอน", "ค. 7 ขั้นตอน", "ง. 8 ขั้นตอน"],
                answer: 2,
                explanation: "การพัฒนาผลิตภัณฑ์ใหม่มีทั้งสิ้น 7 ขั้นตอน ตามที่ระบุไว้ในใบงานข้อ 2"
            },
            {
                q: "ข้อใดคือขั้นตอนแรกสุดของการพัฒนาผลิตภัณฑ์ใหม่?",
                options: ["ก. การคัดเลือกไอเดีย", "ข. การสร้างความคิดหรือการแสวงหาไอเดียใหม่", "ค. การพัฒนาผลิตภัณฑ์ต้นแบบ", "ง. การทดสอบตลาด"],
                answer: 1,
                explanation: "การพัฒนาผลิตภัณฑ์ใหม่ต้องเริ่มจากการสร้างความคิดหรือแสวงหาไอเดียใหม่ (Idea Generation) เป็นอันดับแรก"
            },
            {
                q: "หลังจากได้แนวคิดหรือไอเดียผลิตภัณฑ์ใหม่แล้ว ขั้นตอนต่อไปคือข้อใด?",
                options: ["ก. การวิเคราะห์ทางธุรกิจ", "ข. การคัดเลือกความคิด (Idea Screening)", "ค. การทดสอบตลาด", "ง. การจัดจำหน่ายจริง"],
                answer: 1,
                explanation: "ขั้นตอนที่สองคือการคัดเลือกความคิด (Idea Screening) เพื่อกรองไอเดียที่ไม่เหมาะสมออกไปเหลือไว้เฉพาะไอเดียที่ดีที่สุด"
            },
            {
                q: "การพัฒนาผลิตภัณฑ์ต้นแบบ (Product Development) มักจะเกิดขึ้นในขั้นตอนใดของการพัฒนาผลิตภัณฑ์ใหม่?",
                options: ["ก. ขั้นตอนแรกสุด", "ข. หลังจากวิเคราะห์ความเป็นไปได้ทางธุรกิจและผ่านการทดสอบแนวคิดแล้ว", "ค. ก่อนการสร้างความคิด", "ง. หลังจากวางจำหน่ายทั่วประเทศแล้ว"],
                answer: 1,
                explanation: "เมื่อผ่านการคัดเลือกและวิเคราะห์ทางธุรกิจแล้ว จึงเข้าสู่การพัฒนาผลิตภัณฑ์ต้นแบบเพื่อสร้างสินค้าจริงขึ้นมาทด nghiệm"
            },
            {
                q: "การทดสอบตลาด (Market Testing) ในกระบวนการพัฒนาผลิตภัณฑ์ใหม่มีวัตถุประสงค์หลักเพื่ออะไร?",
                options: ["ก. เพื่อลดต้นทุนการผลิตให้ต่ำที่สุด", "ข. เพื่อทดสอบปฏิกิริยาของกลุ่มเป้าหมายและตลาดจริงก่อนการผลิตและจำหน่ายจริงทั่วประเทศ", "ค. เพื่อกำหนดราคาขายให้สูงกว่าคู่แข่ง", "ง. เพื่อยกเลิกการผลิตสินค้าเก่า"],
                answer: 1,
                explanation: "การทดสอบตลาดช่วยให้ธุรกิจทราบผลตอบรับและความพึงพอใจของลูกค้าจริงในพื้นที่จำกัด ก่อนนำออกสู่ตลาดใหญ่"
            },

            // เงื่อนไขการชำระเงิน 3.2/10 N/30 (11-20)
            {
                q: "เงื่อนไขการชำระเงิน '2/10, n/30' ส่วนลด 2% หมายถึงเงื่อนไขในข้อใด?",
                options: ["ก. ให้ส่วนลด 2% หากชำระเงินภายใน 10 วัน", "ข. ให้ส่วนลด 2% หากชำระภายใน 30 วัน", "ค. ชำระเงินภายใน 2 วันได้ลด 10%", "ง. ดึงเวลาชำระได้ 20 วัน"],
                answer: 0,
                explanation: "2/10 หมายถึง ผู้ซื้อจะได้รับส่วนลดเงินสด 2% หากชำระเงินภายใน 10 วันนับจากวันที่ในใบกำกับสินค้า"
            },
            {
                q: "เงื่อนไขการชำระเงิน '2/10, n/30' คำว่า 'n/30' (Net 30) หมายถึงอะไร?",
                options: ["ก. ต้องชำระเงินสุทธิภายใน 30 วันโดยไม่มีส่วนลด", "ข. ให้เครดิตเทอมสูงสุด 3 ปี", "ค. ต้องชำระภายใน 3 วัน", "ง. ได้รับสินค้าภายใน 30 วัน"],
                answer: 0,
                explanation: "n/30 หมายถึง ยอดเงินสุทธิ (Net) ที่ต้องชำระภายในกำหนดเวลา 30 วัน หากไม่ได้รับส่วนลดใน 10 วันแรก"
            },
            {
                q: "หากใบกำกับสินค้าลงวันที่ 15 ตุลาคม 2569 ตามเงื่อนไข 2/10 วันที่สิ้นสุดการได้รับส่วนลด 2% คือวันที่เท่าไร?",
                options: ["ก. 20 ตุลาคม 2569", "ข. 25 ตุลาคม 2569", "ค. 15 พฤศจิกายน 2569", "ง. 30 ตุลาคม 2569"],
                answer: 1,
                explanation: "นับจากวันที่ 15 ตุลาคม 2569 ไปอีก 10 วัน จะตรงกับวันที่ 25 ตุลาคม 2569 ซึ่งเป็นวันสุดท้ายที่ได้รับส่วนลด 2%"
            },

            }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let score = 0;

        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const progressIndicator = document.getElementById('progress-indicator');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');

        function startQuiz() {
            welcomeScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            currentQuestionIndex = 0;
            userAnswers.fill(null);
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            progressIndicator.innerText = `ข้อ ${currentQuestionIndex + 1} / ${questions.length}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
            questionText.innerText = `${currentQuestionIndex + 1}. ${q.q}`;

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'option-item';
                div.innerHTML = `<input type="radio" name="option" id="opt${index}" value="${index}" ${userAnswers[currentQuestionIndex] === index ? 'checked' : ''}> <label for="opt${index}" style="width:100%; cursor:pointer;">${opt}</label>`;
                
                div.onclick = () => selectOption(index);
                optionsContainer.appendChild(div);
            });

            // ตรวจสอบสถานะการตอบของข้อนี้
            if (userAnswers[currentQuestionIndex] !== null) {
                showExplanationAndColor(userAnswers[currentQuestionIndex]);
                nextBtn.disabled = false;
            } else {
                explanationBox.classList.remove('show');
                nextBtn.disabled = true;
            }

            prevBtn.disabled = currentQuestionIndex === 0;
        }

        function selectOption(selectedIndex) {
            // ถ้าน้องเคยตอบไปแล้วและเปลี่ยนคำตอบ ให้คำนวณคะแนนใหม่
            const previousAnswer = userAnswers[currentQuestionIndex];
            userAnswers[currentQuestionIndex] = selectedIndex;

            // ตรวจสอบความถูกต้องและแสดงผลทันทีตามเงื่อนไข
            showExplanationAndColor(selectedIndex);

            // เปิดใช้งานปุ่มถัดไป
            nextBtn.disabled = false;
        }

        function showExplanationAndColor(selectedIndex) {
            const q = questions[currentQuestionIndex];
            const optionItems = optionsContainer.getElementsByClassName('option-item');

            for (let i = 0; i < optionItems.length; i++) {
                optionItems[i].classList.remove('correct', 'incorrect');
                const radio = optionItems[i].querySelector('input');
                if (i === q.answer) {
                    optionItems[i].classList.add('correct');
                    radio.checked = true;
                } else if (i === selectedIndex && i !== q.answer) {
                    optionItems[i].classList.add('incorrect');
                    radio.checked = true;
                }
            }

            if (selectedIndex === q.answer) {
                explanationTitle.innerText = "ถูกต้อง! ยอดเยี่ยมมาก";
                explanationTitle.style.color = "var(--success-color)";
            } else {
                explanationTitle.innerText = "ยังไม่ถูกต้อง!";
                explanationTitle.style.color = "var(--error-color)";
            }

            explanationText.innerText = q.explanation;
            explanationBox.classList.add('show');
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }

        function calculateScore() {
            score = 0;
            for (let i = 0; i < questions.length; i++) {
                if (userAnswers[i] === questions[i].answer) {
                    score++;
                }
            }
        }

        function showResult() {
            calculateScore();
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            const percentage = ((score / questions.length) * 100).toFixed(1);
            document.getElementById('final-percentage').innerText = `${percentage}%`;
            const wrongCount = questions.length - score;
            document.getElementById('final-wrong').innerText = wrongCount;

            const wrongReviewContainer = document.getElementById('wrong-review-container');
            wrongReviewContainer.innerHTML = '';

            if (wrongCount > 0) {
                let wrongHtml = '<h3>รายการข้อที่ตอบผิดและคำอธิบายที่ถูกต้อง:</h3>';
                questions.forEach((q, index) => {
                    if (userAnswers[index] !== q.answer) {
                        const userAnsText = userAnswers[index] !== null ? q.options[userAnswers[index]] : "ไม่ได้ตอบ";
                        const correctAnsText = q.options[q.answer];
                        wrongHtml += `
                            <div class="wrong-item-card">
                                <p><strong>ข้อ ${index + 1}: ${q.q}</strong></p>
                                <p style="color: var(--error-color); margin-top: 5px;">คำตอบที่คุณเลือก: ${userAnsText}</p>
                                <p style="color: var(--success-color);">คำตอบที่ถูกต้อง: ${correctAnsText}</p>
                                <p style="color: #64748b; margin-top: 5px; font-size: 0.95rem;">💡 <strong>คำอธิบาย:</strong> ${q.explanation}</p>
                            </div>
                        `;
                    }
                });
                wrongReviewContainer.innerHTML = wrongHtml;
            } else {
                wrongReviewContainer.innerHTML = '<h3 style="color: var(--success-color); text-align: center;">🎉 ยินดีด้วยคุณตอบถูกครบทุกข้อ!</h3>';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function confirmReset() {
            if (confirm("คุณต้องการรีเซ็ตคำตอบทั้งหมดและเริ่มทำใหม่ตั้งแต่ข้อ 1 ใช่หรือไม่?")) {
                userAnswers = new Array(questions.length).fill(null);
                score = 0;
                welcomeScreen.classList.remove('hidden');
                quizScreen.classList.add('hidden');
                resultScreen.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
